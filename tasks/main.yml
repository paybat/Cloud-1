---

- name: Refresh the apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Docker and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present

- name: Install GNU Make
  ansible.builtin.apt:
    name: make
    state: present

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create the remote application directory
  ansible.builtin.file:
    path: "{{ cloud1_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"


- name: Copy the Compose file to the VM
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/Inception/srcs/docker-compose.yml"
    dest: "{{ cloud1_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Copy the Makefile to the VM
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/Inception/Makefile"
    dest: "{{ cloud1_app_dir }}/Makefile"
    owner: root
    group: root
    mode: "0644"

- name: Copy the service build contexts to the VM
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/Inception/srcs/requirements/"
    dest: "{{ cloud1_app_dir }}/requirements/"
    owner: root
    group: root
    mode: preserve
  
- name: Render the runtime environment file
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/inception.env.j2"
    dest: "{{ cloud1_app_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Create WordPress data directory
  ansible.builtin.file:
    path: "{{ cloud1_wordpress_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create MariaDB data directory
  ansible.builtin.file:
    path: "{{ cloud1_mariadb_data_dir }}"
    state: directory
    owner: "100"
    group: "101"
    mode: "0750"

- name: Build and start the application services
  community.docker.docker_compose_v2:
    project_src: "{{ cloud1_app_dir }}"
    state: present
    build: always
    services:
      - mariadb
      - redis
      - wordpress
      - nginx

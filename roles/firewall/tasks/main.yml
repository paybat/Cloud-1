---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
  when: cloud1_enable_firewall | bool

- name: Allow SSH and web traffic
  community.general.ufw:
    rule: allow
    port: '{{ item }}'
    proto: tcp
  loop: ['22', '80', '443']
  when: cloud1_enable_firewall | bool

- name: Deny other incoming traffic
  community.general.ufw:
    direction: incoming
    policy: deny
  when: cloud1_enable_firewall | bool

- name: Enable firewall
  community.general.ufw:
    state: enabled
  when: cloud1_enable_firewall | bool

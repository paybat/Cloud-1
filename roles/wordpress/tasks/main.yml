---
- name: Create remote application directory
  ansible.builtin.file:
    path: '{{ cloud1_app_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure TLS certificate and key are configured together
  ansible.builtin.assert:
    that:
      - (cloud1_tls_cert_src is defined) == (cloud1_tls_key_src is defined)
    fail_msg: 'Set both cloud1_tls_cert_src and cloud1_tls_key_src, or leave both unset.'

- name: Render Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: '{{ cloud1_app_dir }}/docker-compose.yml'
    owner: root
    group: root
    mode: '0644'

- name: Copy service build contexts
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../files/Inception/srcs/requirements/'
    dest: '{{ cloud1_app_dir }}/requirements/'
    owner: root
    group: root
    mode: preserve

- name: Create TLS certificate directory
  ansible.builtin.file:
    path: '{{ cloud1_app_dir }}/tls'
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Render protected runtime environment file
  ansible.builtin.template:
    src: inception.env.j2
    dest: '{{ cloud1_app_dir }}/.env'
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Ensure persistent data directories exist
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ cloud1_wordpress_data_dir }}'
    - '{{ cloud1_mariadb_data_dir }}'

- name: Build and start application services
  community.docker.docker_compose_v2:
    project_src: '{{ cloud1_app_dir }}'
    state: present
    build: policy

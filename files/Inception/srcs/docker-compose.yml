
services:

  nginx:
    container_name: nginx
    image: nginx:hidriouc
    pull_policy: never
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - wordpress:/var/www/wordpress
      - ./tls:/etc/nginx/ssl
    networks:
      - inception
    restart: always
    depends_on:
      wordpress:
        condition: service_started
    env_file:
      - .env

  mariadb:
    image: mariadb:hidriouc
    pull_policy: never
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD","mysqladmin", "ping","--silent"]  
      interval: 5s
      timeout: 5s
      retries: 5

  
  wordpress:
    container_name: wordpress
    image: wordpress:hidriouc
    pull_policy: never
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    volumes:
      - wordpress:/var/www/wordpress
    networks:
      - inception
    restart: always
    depends_on:
      mariadb : 
        condition: service_healthy
    env_file:
      - .env

  redis:
    container_name: redis
    build: requirements/bonus/redis
    image: redis:hidriouc
    pull_policy: never
    env_file: .env
    networks:
      - inception
    restart: always

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${DOMAINNAME}/phpmyadmin/
      UPLOAD_LIMIT: 64M
    networks:
      - inception
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      device: ${WORDPRESSVOLUMEPATH}
      o: bind

  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      device: ${MARIADBVOLUMEPATH}
      o: bind


networks:
  inception:
    name: inception
